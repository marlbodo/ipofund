<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공모주펀드 관리자 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 관리자 계정 접근 제한 제어
        (function() {
            const loginId = localStorage.getItem('login_id');
            if (loginId !== 'admin') {
                alert("관리자 전용 페이지입니다. 로그인 후 이용해주세요.");
                window.location.href = 'index.html';
            }
        })();
    </script>
    <style>
        body { background-color: #f8fafc; color: #334155; font-family: 'Pretendard', sans-serif; font-size: 12px; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        table { border-collapse: separate; border-spacing: 0; }
        th, td { border: 1px solid #e2e8f0; padding: 8px 12px; }
        th { background-color: #f8fafc; font-weight: 700; }
        tr.clickable:hover { background-color: #f1f5f9; cursor: pointer; }
    </style>
</head>
<body class="p-6">

    <header class="mb-4 flex justify-between items-center bg-white p-6 rounded-2xl border shadow-sm">
        <h1 class="text-xl font-black text-slate-800 cursor-pointer" onclick="location.reload()">공모주펀드 관리자</h1>
        <div class="flex items-center space-x-4">
            <a href="members.html" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-xs shadow-sm hover:bg-blue-700 transition-all">회원관리</a>
            <button onclick="handleLogout()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-xl font-bold text-xs hover:bg-gray-300 transition-all">로그아웃</button>
        </div>
    </header>

    <nav class="mb-6 flex space-x-2 bg-white p-3 rounded-2xl border shadow-sm">
        <a href="admin.html" class="bg-blue-50 text-blue-700 px-4 py-2 rounded-xl font-bold text-xs border border-blue-200 shadow-sm transition-all">📊 공모주펀드 주식 보유 현황</a>
        <a href="am.html" class="bg-gray-50 text-gray-600 hover:bg-gray-100 px-4 py-2 rounded-xl font-bold text-xs border border-gray-200 transition-all">🏢 운용사별 보유내역</a>
        <a href="code.html" class="bg-gray-50 text-gray-600 hover:bg-gray-100 px-4 py-2 rounded-xl font-bold text-xs border border-gray-200 transition-all">🔑 종목코드 보기(엑셀용)</a>
    </nav>

    <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl shadow-sm mb-6 flex justify-between items-center">
        <div class="flex items-center space-x-4">
            <span class="text-xs font-bold text-blue-700 bg-blue-100 px-2.5 py-1 rounded-md uppercase tracking-wider">모든 펀드 주식 합계 금액</span>
            <h2 class="text-xl font-black text-blue-900" id="grandTotalAmount">0원</h2>
        </div>
        <button onclick="downloadExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs hover:bg-emerald-700 transition-all shadow-sm">📊 엑셀로 내려받기</button>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 items-start">
        
        <div class="xl:col-span-2 bg-white p-6 rounded-2xl border shadow-sm">
            <h2 class="font-black mb-4 text-slate-800 text-sm">📈 종목별 주식 보유 현황 (금액 내림차순)</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left" id="stockMainTable">
                    <thead>
                        <tr>
                            <th>종목명</th>
                            <th class="num">보유수량</th>
                            <th class="num">전일종가</th>
                            <th class="num">금액</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody">
                        <tr><td colspan="4" class="text-center text-gray-400 py-4">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="detailSection" class="hidden bg-white p-6 rounded-2xl border shadow-sm space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="font-black text-slate-800 text-sm" id="detailTitle">펀드별 보유 상세</h2>
                <button onclick="closeDetail()" class="text-gray-400 hover:text-gray-600 text-xs">닫기 ✕</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr>
                            <th>운용사명</th>
                            <th>펀드명</th>
                            <th>구분</th>
                            <th class="num">보유수량</th>
                            <th class="num">금액</th>
                        </tr>
                    </thead>
                    <tbody id="detailContentBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://hnxvsopwxiamexnxczhj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_1_9-bKTcV3sBQkv10ru__w_iW-51pKt';
        const headers = { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` };

        let globalRawAssets = []; 
        let aggregatedStocks = []; 

        async function fetchDashboardData() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/ipo_assets`, { headers });
                if (!res.ok) throw new Error("네트워크 응답 오류");
                globalRawAssets = await res.json();
                
                calculateStockAggregation();
            } catch (err) {
                console.error(err);
                document.getElementById('stockTableBody').innerHTML = `<tr><td colspan="4" class="text-center text-red-500 font-bold py-4">데이터 로딩에 실패했습니다.</td></tr>`;
            }
        }

        function calculateStockAggregation() {
            const stockMap = {};
            let grandTotal = 0;

            globalRawAssets.forEach(asset => {
                const name = (asset.asset_name || '미지정 종목').trim();
                const qty = Math.round(Number(asset.quantity || 0));
                const amt = Math.round(Number(asset.purchase_amount || 0));

                grandTotal += amt;

                const groupKey = name;

                if (!stockMap[groupKey]) {
                    stockMap[groupKey] = {
                        asset_name: name,
                        total_qty: 0,
                        total_amt: 0
                    };
                }
                stockMap[groupKey].total_qty += qty;
                stockMap[groupKey].total_amt += amt;
            });

            aggregatedStocks = Object.values(stockMap);
            aggregatedStocks.sort((a, b) => b.total_amt - a.total_amt);

            document.getElementById('grandTotalAmount').innerText = Math.round(grandTotal).toLocaleString() + " 원";

            renderMainTable();
        }

        function renderMainTable() {
            const tbody = document.getElementById('stockTableBody');
            if (aggregatedStocks.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-gray-400 py-4">등록된 주식 명세 데이터가 존재하지 않습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = aggregatedStocks.map(stock => {
                const avgPrice = stock.total_qty > 0 ? Math.round(stock.total_amt / stock.total_qty) : 0;
                const escapedName = encodeURIComponent(stock.asset_name);

                return `
                    <tr class="clickable border-b text-slate-700" onclick="showStockDetail('${escapedName}')">
                        <td class="font-medium">${stock.asset_name}</td>
                        <td class="num font-semibold">${Math.round(stock.total_qty).toLocaleString()}</td>
                        <td class="num text-gray-500">${avgPrice.toLocaleString()}</td>
                        <td class="num font-bold text-slate-900">${Math.round(stock.total_amt).toLocaleString()}</td>
                    </tr>
                `;
            }).join('');
        }

        function showStockDetail(escapedName) {
            const name = decodeURIComponent(escapedName);
            
            document.getElementById('detailTitle').innerText = `📊 [${name}] 펀드별 보유 현황`;
            
            const filtered = globalRawAssets.filter(a => {
                const n = (a.asset_name || '미지정 종목').trim();
                return n === name;
            });
            
            const detailTbody = document.getElementById('detailContentBody');
            let totalQty = 0;
            let totalAmt = 0;

            let html = filtered.map(item => {
                const qty = Math.round(Number(item.quantity || 0));
                const amt = Math.round(Number(item.purchase_amount || 0));
                totalQty += qty;
                totalAmt += amt;

                return `
                    <tr class="border-b text-xs">
                        <td>${item.company || '-'}</td>
                        <td class="font-medium text-slate-800">${item.fund_name || '-'}</td>
                        <td><span class="px-2 py-0.5 rounded text-[10px] font-bold ${item.fund_type === '본펀드' ? 'bg-blue-50 text-blue-600 border border-blue-200' : 'bg-emerald-50 text-emerald-600 border border-emerald-200'}">${item.fund_type || '본펀드'}</span></td>
                        <td class="num">${qty.toLocaleString()}</td>
                        <td class="num font-semibold text-slate-900">${amt.toLocaleString()}</td>
                    </tr>
                `;
            }).join('');

            if(html.length > 0) {
                html += `
                    <tr class="bg-slate-50 font-black text-slate-900">
                        <td colspan="3" class="text-center">합계</td>
                        <td class="num">${Math.round(totalQty).toLocaleString()}</td>
                        <td class="num text-blue-600">${Math.round(totalAmt).toLocaleString()}</td>
                    </tr>
                `;
            }

            detailTbody.innerHTML = html;
            document.getElementById('detailSection').classList.remove('hidden');
        }

        function closeDetail() {
            document.getElementById('detailSection').classList.add('hidden');
        }

        function downloadExcel() {
            if(aggregatedStocks.length === 0) return alert("다운로드할 데이터가 없습니다.");

            let excelHtml = `
                <meta charset="utf-8">
                <table border="1">
                    <thead>
                        <tr style="background-color:#f1f5f9; font-weight:bold;">
                            <th>종목명</th>
                            <th>보유수량</th>
                            <th>전일종가</th>
                            <th>금액</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            aggregatedStocks.forEach(stock => {
                const avgPrice = stock.total_qty > 0 ? Math.round(stock.total_amt / stock.total_qty) : 0;
                excelHtml += `
                    <tr>
                        <td>${stock.asset_name}</td>
                        <td>${Math.round(stock.total_qty)}</td>
                        <td>${avgPrice}</td>
                        <td>${Math.round(stock.total_amt)}</td>
                    </tr>
                `;
            });

            excelHtml += `</tbody></table>`;

            const blob = new Blob([excelHtml], { type: 'application/vnd.ms-excel' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `공모주펀드_종목별_보유현황_${new Date().toISOString().slice(0,10)}.xls`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function handleLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        window.onload = fetchDashboardData;
    </script>
</body>
</html>
