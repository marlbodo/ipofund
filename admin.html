<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - 보유자산 현황</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-3">
                    <span class="text-xl">💼</span>
                    <span class="font-bold text-lg text-slate-900 tracking-tight">자산관리 시스템</span>
                    <span class="bg-blue-50 text-blue-600 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-blue-100">Admin</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-slate-900 px-3 py-2 rounded-lg hover:bg-slate-50 transition">
                        🏠 홈으로
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
                    📊 보유자산 현황 관리
                </h1>
                <p class="text-slate-500 text-sm mt-1">시스템에 등록된 전체 보유자산 목록과 세부 수량을 모니터링합니다.</p>
            </div>
            
            <div class="flex items-center gap-3 bg-white p-4 rounded-xl border border-slate-200 shadow-sm self-start md:self-auto">
                <div class="p-2.5 bg-blue-50 rounded-lg text-blue-600">
                    <i class="fa-solid fa-boxes-stacked text-lg"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">총 등록 종목 수</p>
                    <p class="text-xl font-bold text-slate-800" id="total-count">0개 종목</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            
            <div class="p-5 border-b border-slate-100 bg-slate-50/50 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div class="flex items-center gap-2">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-sm font-semibold text-slate-700">실시간 데이터 로드 완료</span>
                </div>
                
                <button onclick="downloadExcel()" class="flex items-center justify-center gap-2 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl shadow-sm hover:shadow transition-all duration-150">
                    <i class="fa-solid fa-file-excel"></i>
                    엑셀 다운로드 (.xlsx)
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="asset-table">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs font-semibold uppercase tracking-wider">
                            <th class="py-3.5 px-4 text-center w-16">No.</th>
                            <th class="py-3.5 px-6">종목명</th>
                            <th class="py-3.5 px-4 text-left">종목코드</th>
                            <th class="py-3.5 px-6 text-right">보유수량</th>
                            <th class="py-3.5 px-6 text-right">전일종가</th>
                            <th class="py-3.5 px-6 text-right">금액 (원)</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm text-slate-700">
                        </tbody>
                </table>
            </div>
            
            <div id="loading-spinner" class="py-12 flex flex-col items-center justify-center gap-3">
                <div class="w-8 h-8 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                <p class="text-xs text-slate-400 font-medium">자산 데이터를 불러오는 중입니다...</p>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 mt-auto py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-400">
            <p>© 2026 자산관리 시스템 Admin. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <script>
        // 전역 데이터 저장용 변수
        let currentAssetsData = [];

        // 데이터 렌더링 함수
        function renderTable(data) {
            const tbody = document.querySelector('#asset-table tbody');
            const loadingSpinner = document.getElementById('loading-spinner');
            const totalCountEl = document.getElementById('total-count');
            
            loadingSpinner.classList.add('hidden');
            tbody.innerHTML = '';
            
            if (!data || data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="py-12 text-center text-slate-400">
                            <i class="fa-solid fa-circle-info text-2xl mb-2 block"></i>
                            등록된 보유자산 데이터가 없습니다.
                        </td>
                    </tr>`;
                totalCountEl.textContent = '0개 종목';
                return;
            }

            totalCountEl.textContent = `${data.length}개 종목`;

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/50 transition-colors duration-150';
                
                // 전일종가 및 금액 포맷팅
                const formattedPrice = Number(item.avgPrice || 0).toLocaleString();
                const formattedAmount = Number(item.total_amt || 0).toLocaleString();
                const formattedQty = Number(item.total_qty || 0).toLocaleString();
                
                // 종목코드 가공 (엑셀용 원본 코드)
                const rawCode = item.converted_code || item.stock_code || '-';

                tr.innerHTML = `
                    <td class="py-3 px-4 text-center text-slate-400 font-medium text-xs">${index + 1}</td>
                    <td class="py-3 px-6 font-semibold text-slate-900">${item.asset_name || '-'}</td>
                    <td class="py-3 px-4 text-left font-mono text-[11px] text-slate-400 tracking-wide">${rawCode}</td>
                    <td class="py-3 px-6 text-right font-medium text-slate-600">${formattedQty}</td>
                    <td class="py-3 px-6 text-right text-slate-500">${formattedPrice} 원</td>
                    <td class="py-3 px-6 text-right font-bold text-slate-900">${formattedAmount} 원</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 데이터 로드 모킹 (실제 API 연동 시 fetch로 대체 가능)
        function loadMockData() {
            setTimeout(() => {
                currentAssetsData = [
                    { asset_name: '삼성전자', converted_code: '005930', total_qty: 120, avgPrice: 73500, total_amt: 8820000 },
                    { asset_name: 'SK하이닉스', converted_code: '000660', total_qty: 45, avgPrice: 165000, total_amt: 7425000 },
                    { asset_name: '애플', converted_code: 'AAPL', total_qty: 30, avgPrice: 245000, total_amt: 7350000 },
                    { asset_name: '엔비디아', converted_code: 'NVDA', total_qty: 80, avgPrice: 158000, total_amt: 12640000 },
                    { asset_name: '카카오', converted_code: '035720', total_qty: 150, avgPrice: 48500, total_amt: 7275000 }
                ];
                renderTable(currentAssetsData);
            }, 800);
        }

        // 엑셀 다운로드 기능
        function downloadExcel() {
            if (currentAssetsData.length === 0) {
                alert('다운로드할 데이터가 없습니다.');
                return;
            }

            // 엑셀로 내보낼 데이터 맵핑
            const excelData = currentAssetsData.map((item, index) => ({
                'No.': index + 1,
                '종목명': item.asset_name || '-',
                '종목코드': item.converted_code || item.stock_code || '-',
                '보유수량': item.total_qty || 0,
                '전일종가': item.avgPrice || 0,
                '금액(원)': item.total_amt || 0
            }));

            // SheetJS를 사용한 다운로드 처리
            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "보유자산현황");

            // 컬럼 너비 설정
            const max_widths = [
                { wch: 6 },   // No
                { wch: 20 },  // 종목명
                { wch: 12 },  // 종목코드
                { wch: 12 },  // 보유수량
                { wch: 15 },  // 전일종가
                { wch: 18 }   // 금액(원)
            ];
            worksheet['!cols'] = max_widths;

            // 파일 저장
            XLSX.writeFile(workbook, `보유자산현황_관리자용_${new Date().toISOString().slice(0, 10)}.xlsx`);
        }

        // 초기 페이지 로드 시 가상 데이터 바인딩
        window.addEventListener('DOMContentLoaded', loadMockData);
    </script>
</body>
</html>
