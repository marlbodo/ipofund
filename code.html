<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>종목코드 전체 보기(엑셀용) | 공모주펀드 관리자</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 관리자 계정 접근 제한 제어
        (function() {
            const loginId = localStorage.getItem('login_id');
            if (loginId !== 'admin') {
                alert("관리자 전용 페이지입니다. 로그인 후 이용해주세요.");
                window.location.href = 'index.html';
            }
        })();
    </script>
    <style>
        body { background-color: #f8fafc; color: #334155; font-family: 'Pretendard', sans-serif; font-size: 12px; }
        .num { font-variant-numeric: tabular-nums; }
        table { border-collapse: separate; border-spacing: 0; }
        th, td { border: 1px solid #e2e8f0; padding: 8px 12px; }
        th { background-color: #f8fafc; font-weight: 700; }
    </style>
</head>
<body class="p-6">

    <header class="mb-4 flex justify-between items-center bg-white p-6 rounded-2xl border shadow-sm">
        <h1 class="text-xl font-black text-slate-800 cursor-pointer" onclick="location.href='admin.html'">공모주펀드 관리자</h1>
        <div class="flex items-center space-x-4">
            <a href="members.html" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-xs shadow-sm hover:bg-blue-700 transition-all">회원관리</a>
            <button onclick="handleLogout()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-xl font-bold text-xs hover:bg-gray-300 transition-all">로그아웃</button>
        </div>
    </header>

    <nav class="mb-6 flex space-x-2 bg-white p-3 rounded-2xl border shadow-sm">
        <a href="admin.html" class="bg-gray-50 text-gray-600 hover:bg-gray-100 px-4 py-2 rounded-xl font-bold text-xs border border-gray-200 transition-all">📊 공모주펀드 주식 보유 현황</a>
        <a href="am.html" class="bg-gray-50 text-gray-600 hover:bg-gray-100 px-4 py-2 rounded-xl font-bold text-xs border border-gray-200 transition-all">🏢 펀드별 보유내역</a>
        <a href="code.html" class="bg-blue-50 text-blue-700 px-4 py-2 rounded-xl font-bold text-xs border border-blue-200 shadow-sm transition-all">🔑 종목코드 보기(엑셀용)</a>
    </nav>

    <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-sm mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
            <h2 class="text-base font-black text-white">🔑 전체 종목코드 리스트 (전체 출력)</h2>
            <p class="text-xs text-slate-300 mt-1">필터링 없이 데이터베이스(DB)에 저장된 모든 주식명과 모든 코드를 가공 없이 나열합니다.</p>
        </div>
        <div class="flex items-center space-x-3 shrink-0">
            <span class="text-xs font-bold text-slate-300 bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-600">
                조회된 전체 항목: <span id="totalCodeCount" class="text-emerald-400 font-extrabold">0</span>개
            </span>
            <button onclick="downloadCodeExcel()" class="bg-emerald-600 text-white px-4 py-2.5 rounded-xl font-bold text-xs hover:bg-emerald-700 transition-all shadow-sm flex items-center gap-1.5">
                📊 전체 리스트 엑셀로 저장하기
            </button>
        </div>
    </div>

    <div class="bg-white p-6 rounded-2xl border shadow-sm max-w-3xl mx-auto">
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-black text-slate-800 text-sm">📈 전체 종목코드 목록</h2>
            <span class="text-[11px] text-slate-400">※ 데이터베이스에 기록된 내용이 그대로 표기됩니다.</span>
        </div>
        
        <div class="overflow-x-auto">
            <table class="w-full text-left" id="codeTable">
                <thead>
                    <tr>
                        <th class="w-16 text-center">No.</th>
                        <th>종목명</th>
                        <th class="w-48">종목코드 (원본 그대로)</th>
                    </tr>
                </thead>
                <tbody id="codeTableBody">
                    <tr><td colspan="3" class="text-center text-gray-400 py-6">데이터를 불러오는 중입니다...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hnxvsopwxiamexnxczhj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_1_9-bKTcV3sBQkv10ru__w_iW-51pKt';
        const headers = { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` };

        let rawStocks = []; // 중복 제거만 수행한 원본 보존 배열

        async function fetchAllStockCodes() {
            try {
                // Supabase에서 자산 원본 데이터 호출
                const res = await fetch(`${SUPABASE_URL}/rest/v1/ipo_assets`, { headers });
                if (!res.ok) throw new Error("데이터 로딩 실패");
                
                const rawAssets = await res.json();
                processRawData(rawAssets);
            } catch (err) {
                console.error("API 연동 에러:", err);
                document.getElementById('codeTableBody').innerHTML = `
                    <tr><td colspan="3" class="text-center text-red-500 font-bold py-6">데이터를 불러오지 못했습니다. 네트워크 상태 및 Supabase 설정을 확인해 주세요.</td></tr>
                `;
            }
        }

        function processRawData(assets) {
            const stockMap = {};

            assets.forEach(asset => {
                const name = (asset.asset_name || '').trim();
                // 원본에 저장된 코드 그대로 추출 (공백 제거만 진행)
                const code = (asset.asset_code || asset.ticker || asset.stock_code || '').trim();

                if (name) {
                    // 동일한 종목명이 여러 개 존재할 수 있으므로, 키값으로 중복만 묶어줍니다.
                    // 코드가 비어 있는 주식이더라도 일단 공백으로 채워 다 보여줍니다.
                    stockMap[name] = code || '-';
                }
            });

            // 종목명 기준으로 가나다순 정렬
            rawStocks = Object.keys(stockMap).map(name => ({
                asset_name: name,
                asset_code: stockMap[name]
            })).sort((a, b) => a.asset_name.localeCompare(b.asset_name, 'ko'));

            // 개수 바인딩 및 화면 렌더링
            document.getElementById('totalCodeCount').innerText = rawStocks.length;
            renderCodeTable();
        }

        function renderCodeTable() {
            const tbody = document.getElementById('codeTableBody');
            if (rawStocks.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-gray-400 py-6">조회할 주식 데이터가 존재하지 않습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = rawStocks.map((stock, index) => `
                <tr class="hover:bg-slate-50 border-b text-slate-700">
                    <td class="text-center font-bold text-gray-400">${index + 1}</td>
                    <td class="font-medium text-slate-900">${stock.asset_name}</td>
                    <td class="font-mono text-blue-600 font-bold tracking-wider">${stock.asset_code}</td>
                </tr>
            `).join('');
        }

        // 전체 주식명, 종목코드 데이터 엑셀 파일 다운로드
        function downloadCodeExcel() {
            if (rawStocks.length === 0) return alert("다운로드할 데이터가 없습니다.");

            let excelHtml = `
                <meta charset="utf-8">
                <table border="1">
                    <thead>
                        <tr style="background-color:#0f172a; color:#ffffff; font-weight:bold; height:30px;">
                            <th>종목명</th>
                            <th>종목코드</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            rawStocks.forEach(stock => {
                excelHtml += `
                    <tr style="height:25px;">
                        <td style="font-family:'Malgun Gothic'; text-align:left;">${stock.asset_name}</td>
                        <td style="font-family:'Consolas'; mso-number-format:'@'; text-align:center;">${stock.asset_code}</td>
                    </tr>
                `;
            });

            excelHtml += `</tbody></table>`;

            const blob = new Blob([excelHtml], { type: 'application/vnd.ms-excel' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `공모주펀드_전체_종목코드리스트_${new Date().toISOString().slice(0,10)}.xls`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function handleLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // 페이지 로드 시 원본 데이터 즉시 불러오기
        window.onload = fetchAllStockCodes;
    </script>
</body>
</html>
