<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공모주펀드 관리자 - 펀드별 보유내역</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 관리자 계정 접근 제한 제어
        (function() {
            const loginId = localStorage.getItem('login_id');
            if (loginId !== 'admin') {
                alert("관리자 전용 페이지입니다. 로그인 후 이용해주세요.");
                window.location.href = 'index.html';
            }
        })();
    </script>
    <style>
        body { background-color: #f8fafc; color: #334155; font-family: 'Pretendard', sans-serif; font-size: 12px; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        table { border-collapse: separate; border-spacing: 0; }
        th, td { border: 1px solid #e2e8f0; padding: 8px 12px; }
        th { background-color: #f8fafc; font-weight: 700; }
        tr.clickable:hover { background-color: #f1f5f9; cursor: pointer; }
    </style>
</head>
<body class="p-6">

    <header class="mb-4 flex justify-between items-center bg-white p-6 rounded-2xl border shadow-sm">
        <h1 class="text-xl font-black text-slate-800 cursor-pointer" onclick="location.reload()">공모주펀드 관리자</h1>
        <div class="flex items-center space-x-4">
            <a href="members.html" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-xs shadow-sm hover:bg-blue-700 transition-all">회원관리</a>
            <button onclick="handleLogout()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-xl font-bold text-xs hover:bg-gray-300 transition-all">로그아웃</button>
        </div>
    </header>

    <nav class="mb-6 flex space-x-2 bg-white p-3 rounded-2xl border shadow-sm">
        <a href="admin.html" class="bg-gray-50 text-gray-600 hover:bg-gray-100 px-4 py-2 rounded-xl font-bold text-xs border border-gray-200 transition-all">📊 공모주펀드 주식 보유 현황</a>
        <a href="am.html" class="bg-blue-50 text-blue-700 px-4 py-2 rounded-xl font-bold text-xs border border-blue-200 shadow-sm transition-all">🏢 펀드별 보유내역</a>
        <a href="code.html" class="bg-gray-50 text-gray-600 hover:bg-gray-100 px-4 py-2 rounded-xl font-bold text-xs border border-gray-200 transition-all">🔑 종목코드 보기(엑셀용)</a>
    </nav>

    <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div class="flex flex-wrap items-center gap-6">
            <div class="flex items-center space-x-2 border-r pr-6 border-blue-200">
                <span class="text-xs font-bold text-slate-500 bg-slate-200/60 px-2 py-0.5 rounded">모든 펀드 합계</span>
                <h2 class="text-lg font-black text-slate-800" id="grandTotalFundSize">0억원</h2>
            </div>
            <div class="flex items-center space-x-2 border-r pr-6 border-blue-200">
                <span class="text-xs font-bold text-blue-700 bg-blue-100 px-2.5 py-0.5 rounded">주식 합계 금액</span>
                <h2 class="text-lg font-black text-blue-900" id="grandTotalAmount">0원</h2>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2.5 py-0.5 rounded">전체 주식 비중</span>
                <h2 class="text-lg font-black text-emerald-900" id="grandTotalStockRate">0.00%</h2>
            </div>
        </div>
        <button onclick="downloadExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs hover:bg-emerald-700 transition-all shadow-sm shrink-0">📊 엑셀로 내려받기</button>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 items-start">
        
        <div class="xl:col-span-2 bg-white p-6 rounded-2xl border shadow-sm">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-black text-slate-800 text-sm">📈 펀드별 보유 현황 (금액 내림차순)</h2>
                <span class="text-xs font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg">총 펀드 수: <span id="fundCount" class="text-blue-600">0</span>개</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left" id="fundMainTable">
                    <thead>
                        <tr>
                            <th class="w-12 text-center">No.</th>
                            <th>운용사명</th>
                            <th>펀드명</th>
                            <th class="num">펀드금액 (억원)</th>
                            <th class="num">지분율</th>
                            <th class="num">주식수</th>
                            <th class="num">주식금액 (원)</th>
                            <th class="num">주식비중</th>
                        </tr>
                    </thead>
                    <tbody id="fundTableBody">
                        <tr><td colspan="8" class="text-center text-gray-400 py-4">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="detailSection" class="hidden bg-white p-6 rounded-2xl border shadow-sm space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="font-black text-slate-800 text-sm" id="detailTitle">펀드별 보유 상세</h2>
                <button onclick="closeDetail()" class="text-gray-400 hover:text-gray-600 text-xs">닫기 ✕</button>
            </div>
            
            <div class="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-xl border text-[11px]">
                <div><span class="text-gray-500">펀드금액:</span> <span class="font-bold text-slate-800" id="infoFundSize">0억원</span></div>
                <div><span class="text-gray-500">지분율:</span> <span class="font-bold text-slate-800" id="infoEquityRate">0%</span></div>
                <div><span class="text-gray-500">금액합계:</span> <span class="font-bold text-blue-600" id="infoTotalAmt">0원</span></div>
                <div><span class="text-gray-500">주식비중:</span> <span class="font-bold text-emerald-600" id="infoStockRate">0.00%</span></div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr>
                            <th>종목명</th>
                            <th class="num">보유수량</th>
                            <th class="num">종가</th>
                            <th class="num">금액 (원)</th>
                        </tr>
                    </thead>
                    <tbody id="detailContentBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://hnxvsopwxiamexnxczhj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_1_9-bKTcV3sBQkv10ru__w_iW-51pKt';
        const headers = { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` };

        let globalRawAssets = []; 
        let globalRawFunds = [];
        let aggregatedFunds = []; 

        async function fetchDashboardData() {
            try {
                const [assetsRes, fundsRes] = await Promise.all([
                    fetch(`${SUPABASE_URL}/rest/v1/ipo_assets`, { headers }),
                    fetch(`${SUPABASE_URL}/rest/v1/ipo_funds`, { headers })
                ]);

                if (!assetsRes.ok || !fundsRes.ok) throw new Error("네트워크 응답 오류");
                
                globalRawAssets = await assetsRes.json();
                globalRawFunds = await fundsRes.json();
                
                calculateFundAggregation();
            } catch (err) {
                console.error(err);
                document.getElementById('fundTableBody').innerHTML = `<tr><td colspan="8" class="text-center text-red-500 font-bold py-4">데이터 로딩에 실패했습니다.</td></tr>`;
            }
        }

        // 펀드명 기준 집계 연산 로직 변경
        function calculateFundAggregation() {
            const fundMap = {};
            let totalGrandAmt = 0;
            let totalGrandFundSize = 0;

            // 1. ipo_funds 매핑 (펀드명 고유 키 설정)
            globalRawFunds.forEach(fund => {
                const fName = (fund.fund_name || '미지정 펀드').trim();
                const company = (fund.company || '미지정 운용사').trim();
                const fundSize = Number(fund.fund_size || 0); 
                const equityRate = Number(fund.equity_rate || 0);

                if (!fundMap[fName]) {
                    fundMap[fName] = {
                        fund_name: fName,
                        company_name: company,
                        fund_size: 0,
                        equity_rate: 0,
                        total_qty: 0,
                        total_amt: 0 
                    };
                }
                fundMap[fName].fund_size += fundSize;
                fundMap[fName].equity_rate = equityRate;
            });

            // 2. ipo_assets 매핑 누적
            globalRawAssets.forEach(asset => {
                const fName = (asset.fund_name || '미지정 펀드').trim();
                const company = (asset.company || '미지정 운용사').trim();
                const qty = Math.round(Number(asset.quantity || 0));
                const amt = Number(asset.purchase_amount || 0);

                if (!fundMap[fName]) {
                    fundMap[fName] = {
                        fund_name: fName,
                        company_name: company,
                        fund_size: 0,
                        equity_rate: 0,
                        total_qty: 0,
                        total_amt: 0
                    };
                }
                fundMap[fName].total_qty += qty;
                fundMap[fName].total_amt += amt;
            });

            aggregatedFunds = Object.values(fundMap);

            // 3. 단위 변환 및 비중 계산 (소수점 2자리)
            aggregatedFunds.forEach(f => {
                totalGrandAmt += f.total_amt;
                totalGrandFundSize += f.fund_size;

                const fundSizeInWon = f.fund_size * 100000000;
                f.stock_rate = fundSizeInWon > 0 ? ((f.total_amt / fundSizeInWon) * 100).toFixed(2) : "0.00";
            });

            // 주식금액 기준 내림차순 정렬
            aggregatedFunds.sort((a, b) => b.total_amt - a.total_amt);

            // 4. 상단 대시보드 반영
            document.getElementById('grandTotalFundSize').innerText = Math.round(totalGrandFundSize).toLocaleString() + " 억원";
            document.getElementById('grandTotalAmount').innerText = Math.round(totalGrandAmt).toLocaleString() + " 원";
            
            const overallStockRate = (totalGrandFundSize * 100000000) > 0 ? ((totalGrandAmt / (totalGrandFundSize * 100000000)) * 100).toFixed(2) : "0.00";
            document.getElementById('grandTotalStockRate').innerText = overallStockRate + "%";

            // 총 펀드 개수 표기
            document.getElementById('fundCount').innerText = aggregatedFunds.length;

            renderMainTable();
        }

        function renderMainTable() {
            const tbody = document.getElementById('fundTableBody');
            if (aggregatedFunds.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-gray-400 py-4">등록된 펀드 데이터가 존재하지 않습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = aggregatedFunds.map((f, index) => {
                const escapedFund = encodeURIComponent(f.fund_name);

                return `
                    <tr class="clickable border-b text-slate-700" onclick="showFundDetail('${escapedFund}')">
                        <td class="text-center font-bold text-gray-400">${index + 1}</td>
                        <td class="text-gray-500">${f.company_name}</td>
                        <td class="font-medium text-blue-600">${f.fund_name}</td>
                        <td class="num font-semibold text-slate-600">${Math.round(f.fund_size).toLocaleString()}</td>
                        <td class="num text-gray-500">${Number(f.equity_rate).toFixed(2)}%</td>
                        <td class="num text-slate-700">${Math.round(f.total_qty).toLocaleString()}</td>
                        <td class="num font-bold text-slate-900">${Math.round(f.total_amt).toLocaleString()}</td>
                        <td class="num font-semibold text-emerald-600">${f.stock_rate}%</td>
                    </tr>
                `;
            }).join('');
        }

        function showFundDetail(escapedFund) {
            const fundName = decodeURIComponent(escapedFund);
            const target = aggregatedFunds.find(f => f.fund_name === fundName);

            if(!target) return;

            // 요약 우측 카드 정보 반영
            document.getElementById('detailTitle').innerText = `📊 [${fundName}] 보유 종목 상세`;
            document.getElementById('infoFundSize').innerText = Math.round(target.fund_size).toLocaleString() + "억원";
            document.getElementById('infoEquityRate').innerText = Number(target.equity_rate).toFixed(2) + "%";
            document.getElementById('infoTotalAmt').innerText = Math.round(target.total_amt).toLocaleString() + "원";
            document.getElementById('infoStockRate').innerText = target.stock_rate + "%";

            // 해당 펀드명으로 필터링
            const filtered = globalRawAssets.filter(a => (a.fund_name || '미지정 펀드').trim() === fundName);
            const detailTbody = document.getElementById('detailContentBody');
            
            let totalQty = 0;
            let totalAmt = 0;

            let html = filtered.map(item => {
                const name = (item.asset_name || '미지정 종목').trim();
                const qty = Math.round(Number(item.quantity || 0));
                const amtOriginal = Number(item.purchase_amount || 0);
                const closePrice = qty > 0 ? Math.round(amtOriginal / qty) : 0; 

                totalQty += qty;
                totalAmt += amtOriginal;

                return `
                    <tr class="border-b text-xs">
                        <td class="font-medium text-slate-800">${name}</td>
                        <td class="num text-slate-600">${qty.toLocaleString()}</td>
                        <td class="num text-gray-500">${closePrice.toLocaleString()}</td>
                        <td class="num font-semibold text-slate-900">${Math.round(amtOriginal).toLocaleString()}</td>
                    </tr>
                `;
            }).join('');

            if(html.length > 0) {
                html += `
                    <tr class="bg-slate-50 font-black text-slate-900">
                        <td class="text-center">합계</td>
                        <td class="num text-slate-700">${Math.round(totalQty).toLocaleString()}</td>
                        <td class="num text-gray-400">-</td>
                        <td class="num text-blue-600">${Math.round(totalAmt).toLocaleString()}</td>
                    </tr>
                `;
            }

            detailTbody.innerHTML = html;
            document.getElementById('detailSection').classList.remove('hidden');
        }

        function closeDetail() {
            document.getElementById('detailSection').classList.add('hidden');
        }

        function downloadExcel() {
            if(aggregatedFunds.length === 0) return alert("다운로드할 데이터가 없습니다.");

            let excelHtml = `
                <meta charset="utf-8">
                <table border="1">
                    <thead>
                        <tr style="background-color:#f1f5f9; font-weight:bold;">
                            <th>No.</th>
                            <th>운용사명</th>
                            <th>펀드명</th>
                            <th>펀드금액 (억원)</th>
                            <th>지분율</th>
                            <th>주식수</th>
                            <th>주식금액 (원)</th>
                            <th>주식비중</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            aggregatedFunds.forEach((f, index) => {
                excelHtml += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${f.company_name}</td>
                        <td>${f.fund_name}</td>
                        <td>${Math.round(f.fund_size)}</td>
                        <td>${Number(f.equity_rate).toFixed(2)}%</td>
                        <td>${Math.round(f.total_qty)}</td>
                        <td>${Math.round(f.total_amt)}</td>
                        <td>${f.stock_rate}%</td>
                    </tr>
                `;
            });

            excelHtml += `</tbody></table>`;

            const blob = new Blob([excelHtml], { type: 'application/vnd.ms-excel' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `공모주펀드_펀드별_보유내역_${new Date().toISOString().slice(0,10)}.xls`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function handleLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        window.onload = fetchDashboardData;
    </script>
</body>
</html>
